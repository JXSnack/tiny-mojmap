name: Generate mappings

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.20.1", "1.20.4", "1.20.6", "1.21.1", "1.21.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate mappings for ${{ matrix.version }}
        run: ./gradlew run --args="${{ matrix.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: mojmap-${{ matrix.version }}
          path: build/mappings/mojmap-${{ matrix.version }}.jar
          retention-days: 7
